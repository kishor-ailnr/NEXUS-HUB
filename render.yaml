services:
  # ========================================================
  # NEXUS WAYS - API Backend Web Service (NestJS)
  # ========================================================
  - type: web
    name: nexus-ways-api
    env: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=@nexus-ways/shared && npm run build --workspace=@nexus-ways/api
    startCommand: npm run start:prod --workspace=@nexus-ways/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_ORIGIN
        value: https://smart-supply-chain-v3.web.app,https://smart-supply-chain-v3.firebaseapp.com,https://nexus-ways-web.onrender.com,http://localhost:5173
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ========================================================
  # NEXUS WAYS - Frontend SPA Static Site (Optional on Render)
  # ========================================================
  - type: web
    name: nexus-ways-web
    env: static
    plan: free
    buildCommand: npm ci && npm run build --workspace=@nexus-ways/shared && npm run build --workspace=@nexus-ways/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        fromService:
          type: web
          name: nexus-ways-api
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: nexus-ways-api
          property: host
